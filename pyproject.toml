[project]
name = "fenix-messenger"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "uvicorn[standard]",
    "sqlalchemy",
    "python-jose[cryptography]",
    "passlib[bcrypt]",
    "python-multipart",
    "websockets",
    "psycopg2-binary"
]

[tool.fastapi]
entrypoint = "backend.main:app"
