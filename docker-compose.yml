services:
  app:
    build: .
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg2://fenix:fenix@db:5432/fenix
      JWT_SECRET: change-me
    depends_on: [db]
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fenix
      POSTGRES_USER: fenix
      POSTGRES_PASSWORD: fenix
    volumes: [fenix_db:/var/lib/postgresql/data]
volumes:
  fenix_db:
